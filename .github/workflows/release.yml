# Release : publie le paquet d'une version sur chaque etiquette vX.Y.Z.
#
# Declencheur : `just release` commite, etiquette vX.Y.Z et pousse l'etiquette ;
# c'est cette poussee qui demarre ce workflow. Ne jamais creer l'etiquette a
# la main : passer par `just release` garantit que config.h, CHANGELOG.md,
# le commit et l'etiquette disent la meme version.
#
# Outils : tools/setup.sh (versions epinglees, empreinte verifiee). Le binaire
# publie sort donc de l'avr-gcc du coeur Arduino, pas de celui de nixpkgs qui
# compile au banc : LISEZ-MOI.txt, dans le paquet, dit lequel.
#
# Seul `publier` ecrit sur le depot, et par la CLI gh preinstallee : aucune
# action tierce ne voit le jeton en ecriture.
name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  verifier:
    name: Balayage des variantes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: arduino-cli et coeur AVR, versions epinglees
        run: ./tools/setup.sh
      - name: Les quinze variantes compilent
        run: VHELIO_BUILD=./tools/build.sh ./tools/check-variants.sh

  publier:
    name: Paquet et Release GitHub
    needs: verifier
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: arduino-cli et coeur AVR, versions epinglees
        run: ./tools/setup.sh

      - name: Coherence etiquette / config.h
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CFG=$(sed -nE 's/^#define[[:space:]]+VHELIO_FW_VERSION[[:space:]]+"([^"]+)".*/\1/p' firmware/vhelio/src/config.h)
          echo "etiquette : $TAG — config.h : $CFG"
          [ "$TAG" = "$CFG" ] || { echo "L'etiquette v$TAG ne correspond pas a VHELIO_FW_VERSION $CFG : passer par \`just release\`."; exit 1; }

      - name: Paquet
        run: VHELIO_BUILD=./tools/build.sh ./tools/package.sh

      - name: Notes de version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          awk -v ver="$TAG" '
            substr($0, 1, length("## [" ver "]")) == "## [" ver "]" { dedans=1; next }
            dedans && substr($0, 1, 4) == "## [" { exit }
            dedans { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          [ -s "$RUNNER_TEMP/notes.md" ] || { echo "Pas de section [${TAG}] dans CHANGELOG.md."; exit 1; }

      - name: Release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/vhelio-*.zip \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md"
