# CI : rejoue sur chaque poussee vers main et chaque pull request le balayage
# des quinze variantes de config.h, obligatoire avant tout commit (AGENTS.md).
# Les #if non pris ne sont pas verifies par le compilateur : sans ce balayage,
# une variante peut rester cassee des mois. Meme script et memes variables que
# le travail `verifier` de release.yml pour eviter toute divergence.
#
# Outils : tools/setup.sh, comme sur un poste, donc les memes versions
# epinglees et la meme verification d'empreinte. Actions epinglees par SHA :
# une etiquette se deplace, un commit non.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  variantes:
    name: Les quinze variantes compilent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: arduino-cli et coeur AVR, versions epinglees
        run: ./tools/setup.sh
      - name: Balayage des variantes
        run: VHELIO_BUILD=./tools/build.sh ./tools/check-variants.sh
